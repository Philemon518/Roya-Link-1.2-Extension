<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Translated Audio Player</title>
  <link rel="stylesheet" href="../css/player.css">
  <script defer src="../js/player.js"></script>
</head>
<body>
  <div class="container">

    <div class="credit-info">
      <div>Credits deducted: <span id="creditsUsed">--</span></div>
      <div>Remaining Credits: <span id="creditsRemaining">--</span></div>
    </div>

    <div class="player-section">
      <button id="youtubePlayPause" class="play-button">▶️</button>
      <input type="range" id="youtubeTimeline" class="progress-bar" value="0" step="0.1">
      <span id="youtubeTime" class="timeline-info">00:00 / 00:00</span>
    </div>

    <div class="player-section">
      <button id="audioPlayPause" class="play-button">▶️</button>
      <input type="range" id="audioTimeline" class="progress-bar" value="0" step="0.1">
      <span id="audioTime" class="timeline-info">00:00 / 00:00</span>
    </div>

    <div class="footer">
      <button id="closeButton" class="close-button">Close</button>
    </div>

  </div>
</body>
</html>
